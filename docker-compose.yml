services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: prospecting,POSTGRES_USER: postgres,POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U postgres -d prospecting"],interval: 5s,timeout: 5s,retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"],interval: 5s,timeout: 3s,retries: 20}
  api:
    build: {context: .,dockerfile: apps/api/Dockerfile}
    env_file: [.env]
    ports: ["4000:4000"]
    depends_on: {postgres: {condition: service_healthy},redis: {condition: service_healthy}}
  worker:
    build: {context: .,dockerfile: apps/worker/Dockerfile}
    env_file: [.env]
    depends_on: {postgres: {condition: service_healthy},redis: {condition: service_healthy}}
  web:
    build: {context: .,dockerfile: apps/web/Dockerfile}
    environment: {NEXT_PUBLIC_API_URL: http://localhost:4000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {pgdata: {}}